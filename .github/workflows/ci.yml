name: Local candidate verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify runner supports required Node built-ins
        run: node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
      - run: node scripts/check.mjs
      - name: Actual inference remains a separate required gate
        run: node agent/run-model.mjs
