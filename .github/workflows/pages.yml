name: Publish verified static application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchtower-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.WATCHTOWER_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require the verified public API origin
        env:
          WATCHTOWER_PUBLIC_API_ORIGIN: ${{ vars.WATCHTOWER_PUBLIC_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          import {publicRuntimeConfig} from './apps/site/runtime-config.mjs';
          if(!process.env.WATCHTOWER_PUBLIC_API_ORIGIN) throw Error('public_api_origin_required');
          publicRuntimeConfig(process.env.WATCHTOWER_PUBLIC_API_ORIGIN);
          NODE
      - name: Verify the archived actual-model evidence
        run: node scripts/verify-report-evidence.mjs --archived
      - name: Build with the public API origin
        run: node scripts/build-site.mjs
        env:
          WATCHTOWER_PUBLIC_API_ORIGIN: ${{ vars.WATCHTOWER_PUBLIC_API_ORIGIN }}
          BUILD_REVISION: ${{ github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

